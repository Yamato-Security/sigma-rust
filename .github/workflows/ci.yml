name: CI

on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get rules from SigmaHQ for testing
        run: |
          wget https://github.com/SigmaHQ/sigma/releases/download/r2024-09-02/sigma_all_rules.zip
          unzip sigma_all_rules.zip -d sigma-main-rules

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test -- --nocapture

      - name: Run tests without default features
        run: cargo test --no-default-features -- --nocapture

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Check fmt
        run: cargo fmt --all -- --check

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get rules from SigmaHQ for testing
        run: |
          wget https://github.com/SigmaHQ/sigma/releases/download/r2024-09-02/sigma_all_rules.zip
          unzip sigma_all_rules.zip -d sigma-main-rules

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  release:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ncipollo/release-action@40bb172bd05f266cf9ba4ff965cb61e9ee5f6d01 # v1.9.0
        with:
          generateReleaseNotes: true
          # A release may already exist if it was created by hand (e.g. with
          # curated notes via `gh release create`) — do not fail the tag build
          # with a 422 "already_exists" in that case.
          skipIfReleaseExists: true
